[project]
name = "tally"
version = "1.3.0"
description = "뉴스센터 온에어 tally 상황판 (DM7 on-air 감지 + Google Calendar 표출 + SSE)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joo Ho Gun" }]
dependencies = [
    "flask>=3.1.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.0.0",
    "rpi-gpio>=0.7.1; sys_platform == 'linux' and platform_machine in 'aarch64 armv6l armv7l armv8l'",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
# SPS(sps.sbs.co.kr) 토큰 발급용 — 브라우저 있는 머신에서 setup/sps_authorize.py 실행할 때만 필요.
# 헤드리스 서버(라즈베리파이)는 uv sync 기본 그룹만 쓰면 되고 이 그룹은 필요 없다.
setup = ["playwright>=1.40.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
