<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBS Web Tally</title>
  <style>
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-ExtraBold.woff2') format('woff2');
      font-weight: 800;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-Black.woff2') format('woff2');
      font-weight: 900;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* One UI 6 — true black + one confident accent (tally-lamp red).
         Warning(amber)/success(green) are reused, pre-existing semantic
         colors (over/under, confirmed) — not competing "accents". */
      --oneui-bg: #000000;
      --oneui-surface: #1c1c1e;
      --oneui-surface-2: #2c2c2e;
      --oneui-hairline: rgba(255,255,255,0.08);
      --accent: #ff5722;
      --accent-tint: rgba(255,87,34,0.14);
      --success: #30d158;
      --warning: #ff9f0a;
      --warning-tint: rgba(255,159,10,0.14);
      --text-primary: #ffffff;
      --text-secondary: rgba(235,235,245,0.6);
      --text-tertiary: rgba(235,235,245,0.3);
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--oneui-bg);
      font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      user-select: none;
      overflow: hidden;
      cursor: none;
    }

    /* ── 상태 박스 (아날로그 탈리 램프) ───────────────────────────── */
    #status-box {
      position: relative;
      align-self: stretch; /* body는 align-items:center라 stretch를 명시해야 폭 전체를 채움 */
      display: flex;
      align-items: center;
      justify-content: center;
      margin: clamp(14px, 2vh, 28px) clamp(14px, 2vw, 28px) clamp(16px, 2.2vh, 32px);
      padding: clamp(30px, calc(var(--tally-box-scale, 1) * 4vh), 92px) clamp(20px, 4vw, 60px) clamp(24px, calc(var(--tally-box-scale, 1) * 3vh), 70px);
      border-radius: clamp(24px, 3vw, 44px);
      overflow: hidden;
      transition: background 0.2s ease, padding 0.2s ease;
      background: var(--oneui-surface);
    }
    #status-box.on-air {
      background: var(--accent);
      box-shadow: 0 1.4vh 4vh rgba(255,87,34,0.5);
    }

    #status-text {
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      text-transform: uppercase;
      transition: color 0.2s ease;
      position: relative;
      z-index: 3;
      white-space: nowrap;
    }
    #status-box.on-air #status-text {
      color: var(--text-primary);
    }

    /* ── 시계 영역 ──────────────────────────────────────────────── */
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.5vh, 18px);
    }

    #clock {
      font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      line-height: 1;
      transition: font-size 0.2s ease, padding 0.2s ease;
      padding: clamp(8px, calc(var(--clock-box-scale, 1) * 1.4vh), 56px) 0;
      text-align: center;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.22em;
    }
    /* 12시간제일 때만 채워지는 AM/PM 배지 — 큰 시계 옆에 작게 분리해서 표시.
       24시간제(빈 문자열)일 땐 :empty로 완전히 접혀서 자리도 안 차지한다. */
    #clock-meridiem {
      font-size: 0.26em;
      font-weight: 800;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }
    #clock-meridiem:empty { display: none; }

    #info-row {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 36px);
      padding: clamp(8px, 1.5vh, 16px) clamp(20px, 4vw, 48px);
      border-radius: clamp(14px, 1.6vw, 22px);
      background: var(--oneui-surface);
    }
    #date {
      font-size: clamp(1.1rem, 2.8vw, 2rem);
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.12em;
    }
    .divider {
      width: 1px;
      height: clamp(18px, 3vh, 28px);
      background: var(--oneui-hairline);
      flex-shrink: 0;
    }
    #weather {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1.1rem, 2.8vw, 2rem);
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      min-height: 2rem;
    }
    #weather-icon { font-size: 1.2em; line-height: 1; }

    /* ── 캘린더 하단 타임라인 ───────────────────────────────────── */
    #schedule {
      width: 100%;
      border-top: 1px solid var(--oneui-hairline);
      background: var(--oneui-bg);
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      min-height: clamp(134px, calc(var(--sch-box-scale, 1) * 17vh), 347px);
      transition: min-height 0.2s ease;
    }
    .sch-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2vh, 24px) clamp(12px, 2vw, 28px);
      gap: 6px;
      position: relative;
    }
    .sch-slot.prev  { border-right: 1px solid var(--oneui-hairline); opacity: 0.55; }
    .sch-slot.current {
      border-right: 1px solid var(--oneui-hairline);
      background: var(--accent-tint);
    }
    .sch-slot.next  { opacity: 0.55; }

    .sch-label {
      font-size: clamp(1.33rem, calc(var(--sch-scale, 1) * 2vw), 3.2rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-primary);
      background: var(--oneui-surface-2);
      padding: 2px 12px;
      border-radius: 20px;
    }
    .sch-slot.current .sch-label {
      color: #000000;
      background: var(--accent);
    }

    .sch-timerange {
      font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .sch-slot.current .sch-timerange { color: var(--accent); }

    .sch-name {
      font-size: clamp(1rem, 2.2vw, 1.7rem);
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.2;
    }
    .sch-slot.current .sch-name {
      font-size: clamp(1.3rem, 2.8vw, 2.2rem);
      color: var(--text-primary);
    }

    .sch-none {
      font-size: clamp(0.8rem, 1.4vw, 1rem);
      color: rgba(235,235,245,0.18);
      letter-spacing: 0.08em;
    }

    /* ── 방송 시작 카운트다운 ───────────────────────────────────── */
    /* One UI 참조 시안(Direction 3)처럼 화면 하단에 딱 붙는 바가 아니라, 상태
       박스(#status-box)와 같은 방식의 "떠 있는" 단일 다크 카드로 감싼다 —
       프로그램명/시작·종료 시각/트랙이 모두 이 카드 하나 안에 들어간다. */
    #countdown {
      width: auto;
      align-self: stretch;
      margin: 0 clamp(14px, 2vw, 28px) clamp(16px, 2.2vh, 32px);
      border-top: none;
      background: var(--oneui-surface);
      border-radius: clamp(24px, 3vw, 44px);
      /* 러너 뒤 트레일(.cd-runner-trail)은 러너 기준 왼쪽으로 최대 267px*배율
         만큼 뻗어나가는 장식 요소라, 러너가 트랙 맨 앞(0%)에 있을 때 카드
         padding을 훨씬 넘어 카드 밖으로 삐져나감(실제 화면에서 확인됨) —
         트랙 폭 계산으로 여백을 아무리 늘려도 트레일 자체 길이가 더 크면
         또 넘친다. 카드 자체에서 확실하게 잘라내는 게 유일하게 항상 맞는
         방법이라 overflow:hidden으로 카드 경계를 진짜 경계로 만든다. */
      overflow: hidden;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(
        clamp(120px, calc(var(--cd-box-scale, 1) * 14vh), 254px) +
        clamp(54px, calc(var(--cd-text-scale, 1) * 6vh), 107px) +
        clamp(62px, calc(var(--cd-text-scale, 1) * 7.2vh), 134px)
      );
      padding: clamp(16px, calc(var(--cd-text-scale, 1) * 1.8vh), 43px) clamp(20px, 4vw, 40px);
      gap: clamp(0px, 0.4vh, 4px);
      transition: background 0.2s ease, min-height 0.2s ease;
    }
    /* 참조 시안(Direction 3)의 카드 배경은 방송 전/중/후 상태와 무관하게 항상
       동일한 중립 회색(--oneui-surface) — 여기서도 상태별로 카드 배경 자체를
       물들이지 않고 그대로 맞춘다(상태 표시는 알약/트랙 색으로 이미 충분히 됨). */

    /* ── 타이머 + 스톱워치 (좌: 타이머 / 우: 스톱워치) ─────────────── */
    #stopwatch {
      width: 100%;
      border-top: 1px solid var(--oneui-hairline);
      background: var(--oneui-bg);
      display: none;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      min-height: clamp(174px, calc(var(--sw-box-scale, 1) * 20vh), 360px);
      position: relative;
      overflow: hidden;
      transition: min-height 0.2s ease;
    }
    #stopwatch.show { display: flex; }
    .tm-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1vh, 10px);
      padding: 0 clamp(10px, 2vw, 24px);
      position: relative;
    }
    .tm-col::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--tm-accent, #3a3a3c);
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }
    .tm-col.running::before, .tm-col.finished::before { opacity: 1; }
    #timer-col   { --tm-accent: var(--accent); }
    #stopwatch-col { --tm-accent: var(--accent); }

    .tm-divider {
      width: 1px;
      align-self: center;
      height: 60%;
      background: var(--oneui-hairline);
      flex-shrink: 0;
    }
    .tm-label-row {
      display: flex;
      align-items: center;
      gap: 0.6em;
    }
    .tm-dot {
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      background: #3a3a3c;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .tm-col.running .tm-dot, .tm-col.finished .tm-dot {
      background: var(--tm-accent);
      animation: sw-dot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes sw-dot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.7); }
    }
    .tm-label {
      font-size: clamp(1.13rem, calc(var(--sw-text-scale, 1) * 1.7vw), 2.8rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-tertiary);
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .tm-col.running .tm-label, .tm-col.finished .tm-label { color: var(--tm-accent); }
    .tm-value {
      font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.4rem, calc(var(--sw-text-scale, 1) * 4.6vw), 7.2rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      line-height: 1;
      transition: color 0.2s ease;
    }
    /* 참조 시안처럼 타이머(카운트다운) 숫자는 항상 강조색, 스톱워치는 항상
       중립 흰색 — 진행 중 여부와 무관하게 고정(둘 다 진행 중임을 보여주는
       점은 위의 --tm-accent 펄스로 이미 충분히 표현됨). */
    #timer-col .tm-value { color: var(--accent); }

    /* ── 카운트다운 타임라인 (말 트랙) ───────────────────────────── */
    #cd-track {
      --s: var(--cd-box-scale, 1);
      position: relative;
      /* 카드 좌우로 빈 공간이 너무 많고, 그 탓에 시작/종료 라벨 사이 거리가
         좁아서(특히 라벨을 키운 뒤로) 가운데서 겹치는 문제가 있었음 —
         트랙을 카드 폭에 가깝게 넓혀서 라벨 사이 거리를 확보한다.
         단, 94%는 시작/종료 마커 원(반지름 최대 24px + 링 효과)이 카드
         밖으로 삐져나가는 문제가 있었음(실측 확인) — 카드 padding과는
         별개로 마커용 여유를 고정 px로 따로 빼서 항상 안전하게 안에
         들어오도록 계산한다. */
      width: min(calc(100% - 90px), 2200px);
      height: clamp(67px, calc(var(--s) * 7vh), 147px);
      /* 위: 프로그램명/시작·종료 시각 라벨이 트랙 위로 뜨는 공간.
         아래: 러너를 따라다니는 카운트다운 알약이 트랙 아래로 뜨는 공간
         (참조 시안처럼 러너 위 말풍선 대신 트랙 아래 알약으로 옮기면서 추가). */
      /* 위쪽 여백은 프로그램명+시작/종료 라벨(.cd-marker-label) 몫이라
         그걸 키우는 --cd-label-scale을 따른다(스크린샷 실측 후 보강). */
      margin-top: clamp(80px, calc(var(--cd-label-scale, 1) * 6vh), 170px);
      margin-bottom: clamp(62px, calc(var(--cd-text-scale, 1) * 7.2vh), 134px);
      display: none;
    }
    #cd-track.show { display: block; }
    #cd-track-line {
      position: absolute;
      left: 0; right: 0; top: 30%;
      height: clamp(9px, calc(var(--s) * 1.1vh), 26px);
      transform: translateY(-50%);
      background: var(--oneui-surface-2);
      border-radius: 5px;
    }
    #cd-fill {
      position: absolute;
      left: 0; top: 30%;
      height: clamp(9px, calc(var(--s) * 1.1vh), 26px);
      transform: translateY(-50%);
      background: var(--accent);
      border-radius: 5px;
      width: 0%;
      transition: width 1.05s linear, background 0.3s ease;
    }
    #cd-fill.cross-anim { transition: width 0.8s cubic-bezier(0.4,0,0.2,1), background 0.3s ease, left 0.8s cubic-bezier(0.4,0,0.2,1); }

    .cd-marker {
      position: absolute;
      top: 30%;
      left: 0%;
      transform: translate(-50%, -50%);
      z-index: 3;
      transition: left 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    #cd-marker-end { left: 100%; }
    .cd-marker-dot {
      display: block;
      width: clamp(22px, calc(var(--s) * 2.3vh), 56px);
      height: clamp(22px, calc(var(--s) * 2.3vh), 56px);
      border-radius: 50%;
      background: #48484a;
      border: 3px solid var(--oneui-bg);
    }
    #cd-marker-start .cd-marker-dot,
    #cd-marker-end   .cd-marker-dot {
      background: var(--text-primary);
    }
    .cd-marker-dot {
      position: relative;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #cd-marker-start.crossed .cd-marker-dot {
      opacity: 0.16;
      transition: opacity 0.6s ease 0.45s;
    }
    .cd-marker-dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--text-primary);
      opacity: 0;
    }
    .cd-marker-dot.hit {
      animation: marker-hit-scale 0.55s ease-out;
    }
    .cd-marker-dot.hit::after {
      animation: marker-hit-ring 0.65s ease-out;
    }
    @keyframes marker-hit-scale {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.7); }
      65%  { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    @keyframes marker-hit-ring {
      0%   { transform: scale(0.7); opacity: 0.95; }
      100% { transform: scale(3); opacity: 0; }
    }
    /* One UI 참조 시안의 "프로그램명 좌상단 / 시작 시각+길이+체크 좌측 / 종료
       시각 우측, 그 아래 트랙" 배치를 따르기 위해 라벨을 트랙 위쪽으로 올리고
       (예전엔 점 아래였음), 시작 라벨은 좌측, 종료 라벨은 우측에 붙인다. */
    .cd-marker-label {
      position: absolute;
      bottom: 100%;
      margin-bottom: clamp(10px, calc(var(--cd-label-scale, 1) * 1.1vh), 30px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 실제 스크린샷(2560x1440, cdLabelScale=1.95 기준)으로 직접 재보고
         고친 값 — 이전 두 번의 시도(vw 기준, 그다음 clockBaseline 기준
         rem)는 전부 계산만으로 추측하다 실측과 안 맞았음. 지금 값은 시계
         대비 25% 비율이 실제로 나오는 걸 스크린샷으로 확인한 수치. */
      font-size: clamp(1rem, calc(var(--cd-label-scale, 1) * 2.05rem), 4.6rem);
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    #cd-marker-start .cd-marker-label {
      left: 0;
      transform: none;
      align-items: flex-start;
    }
    #cd-marker-end .cd-marker-label {
      left: auto;
      right: 0;
      transform: none;
      align-items: flex-end;
    }
    /* 종료 지점엔 프로그램명이 중복 표시되지 않게 — 참조 시안처럼 프로그램명은
       좌상단 한 곳에만, 우측은 종료 시각만 보이게 한다. */
    #cd-marker-end .cd-marker-program {
      display: none;
    }
    /* 프로그램명·뱃지·체크는 이제 부모(.cd-marker-label) em이 아니라 독립
       크기 — 실측 스크린샷 기준으로 맞춘 값(위 .cd-marker-label 주석 참고).
       참조 시안(Direction 3)의 .bc-title처럼 진하고 촘촘하게(letter-spacing
       타이트) — 예전의 넓은 자간+대문자 변환은 "라벨" 취급이라 시작/종료
       시각이랑 구분이 잘 안 됐다. */
    .cd-marker-program {
      color: var(--text-primary);
      font-size: clamp(0.85rem, calc(var(--cd-label-scale, 1) * 1.35rem), 2.9rem);
      font-weight: 900;
      letter-spacing: -0.005em;
      margin-bottom: 0.25em;
    }
    .cd-marker-program:empty { display: none; margin-bottom: 0; }
    /* 스튜디오 태그("(TS-4)")는 참조 시안의 .bc-studio처럼 연한 회색·중간
       굵기로 — 프로그램명이랑 색을 나눠서 "제목 vs 부가정보" 위계를 준다. */
    .cd-marker-studio {
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0;
      margin-left: 0.2em;
    }
    /* 실제로 주조에서 이 부조로 컷팅된 상태(onAirIndex 기준 broadcastIsLive)일
       때만 프로그램명 옆에 뜨는 LIVE 뱃지 — 방송 예정/대기 중엔 안 보인다. */
    /* .cd-marker-label이 flex-column이라 그 직계 자식은 전부 각자 한 줄씩
       차지한다 — 프로그램명+LIVE뱃지를 한 줄에 나란히 두려면 이 둘을 묶는
       가로 방향 flex 한 줄로 따로 감싸야 한다("나이트 라인(TS-4) LIVE"). */
    .cd-marker-title-row {
      display: flex;
      align-items: baseline;
    }
    .cd-live-badge {
      display: none;
      color: #ffffff;
      background: var(--accent);
      font-weight: 900;
      font-size: 0.4em;
      letter-spacing: 0.05em;
      padding: 0.2em 0.5em 0.18em;
      border-radius: 999px;
      margin-left: 0.4em;
      align-self: center;
    }
    /* 뱃지가 뙇 나타나지 않고 살짝 튀어오르듯 등장 — LIVE 전환처럼 자주
       안 일어나는 상태 변화에만 쓰는 one-shot 모션이라(매초 반복 X)
       24시간 화면에서도 거슬리지 않는다. */
    .cd-live-badge.show {
      display: inline-block;
      animation: cd-live-badge-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes cd-live-badge-in {
      0%   { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .cd-confirmed-mark {
      color: var(--accent);
      font-weight: 900;
      font-size: clamp(0.75rem, calc(var(--cd-label-scale, 1) * 1.2rem), 2.5rem);
    }
    .cd-marker-assigned {
      font-size: clamp(0.75rem, calc(var(--cd-label-scale, 1) * 1.2rem), 2.5rem);
      font-weight: 700;
      color: var(--text-secondary);
      margin: 0 0.05em;
    }
    #cd-runner {
      position: absolute;
      top: 30%;
      left: 0;
      width: 1px;
      height: 1px;
      transform: translateX(0px);
      transition: transform 1.05s linear;
      z-index: 2;
    }
    #cd-runner.cross-anim { transition: transform 0.8s cubic-bezier(0.4,0,0.2,1); }
    /* 참조 시안(Direction 3)처럼 러너 위 말풍선(화살표 포함)이 아니라, 트랙
       아래에 러너를 따라 이동하는 납작한 알약으로. #cd-runner의 1px짜리 박스
       기준 transform:translateX(-50%) 중앙정렬은 러너가 트랙 양끝 근처에 있을
       때 알약이 트랙 밖으로 넘치는 문제가 있어, #cd-track의 직계 자식으로 옮겨
       (러너와 형제 관계) JS가 매 틱 clamp된 절대 left 픽셀값을 직접 넣어준다
       (아래 renderBoundedTrack() 안 추가 코드 참고). */
    .cd-runner-tag {
      position: absolute;
      top: calc(30% + clamp(14px, calc(var(--s) * 1.6vh), 38px));
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 4;
      transition: left 1.05s linear;
    }
    .cd-runner-tag.cross-anim { transition: left 0.8s cubic-bezier(0.4,0,0.2,1); }
    .cd-runner-tag-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 카드 배경(--oneui-surface)과 완전히 같은 색이면 알약 모양 자체가 안
         보여서(방송전/종료 상태에서 확인됨) 한 단계 밝은 회색을 써서 카드
         위에 뜬 알약으로 보이게 한다 — 참조 시안도 tag-idle-bg가 module-bg
         보다 살짝 밝다. */
      background: var(--oneui-surface-2);
      color: var(--text-secondary);
      font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-variant-numeric: tabular-nums;
      /* 참조 시안(Direction 3)의 --travel-pad(.6/1.6/.65cqw)·--travel-radius(1.9cqw)
         비율 그대로 — cqw는 컨테이너 "폭" 기준이라 세로 여백도 vh가 아니라
         vw로 맞춰야 같은 비율이 나온다(예전 값은 vh를 써서 실제보다 납작하고
         모서리도 덜 둥글어 참조 시안보다 투박해 보였음). */
      padding: clamp(9px, calc(var(--cd-text-scale, 1) * 0.6vw), 20px) clamp(20px, calc(var(--cd-text-scale, 1) * 1.6vw), 48px) clamp(10px, calc(var(--cd-text-scale, 1) * 0.65vw), 22px);
      border-radius: clamp(24px, calc(var(--cd-text-scale, 1) * 1.9vw), 56px);
      white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .cd-tag-main-row {
      display: flex;
      align-items: center;
      gap: 0.4em;
    }
    .cd-live-dot {
      display: none;
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: cd-live-pulse 1.4s ease-in-out infinite;
    }
    /* 참조 시안(Direction 3)의 알약엔 점 기호가 없음 — 숫자만 깔끔하게 보여준다는
       원칙(버전3 피드백)과 같은 이유로 여기서도 뺀다. */
    .cd-live-dot.show { display: none; }
    @keyframes cd-live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cd-live-dot { animation: none; }
      .cd-live-badge.show { animation: none; }
    }
    .cd-tag-main {
      color: inherit;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: clamp(1.75rem, calc(var(--cd-text-scale, 1) * 3.3vw), 4.5rem);
      line-height: 1.15;
    }
    .cd-tag-sub {
      display: none;
      color: inherit;
      opacity: 0.8;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-size: clamp(0.9rem, calc(var(--cd-text-scale, 1) * 1.65vw), 2.1rem);
      line-height: 1.15;
      margin-top: 2px;
      width: 100%;
      text-align: center;
    }
    .cd-tag-sub.show { display: block; }
    /* 예정종료시각을 넘겨 아직도 방송 중이면 '-00:00'에 멈춰있는 대신 얼마나
       초과됐는지 세어 보여준다 — LIVE 중엔 말풍선이 이미 붉게 물들어 있어서
       빨강 계열 대신 그 위에서 잘 튀는 노랑(warning)으로 구분한다. */
    .cd-tag-sub.overrun {
      color: var(--warning);
    }
    @keyframes tag-overrun-flash {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.12); }
      65%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    .cd-runner-tag-pill.overrun-hit {
      animation: tag-overrun-flash 0.5s ease-out;
    }
    /* 참조 시안(Direction 3)은 종료 상태 알약에 별도 색을 안 입히고 방송전과
       같은 중립 회색 그대로 둔다(문구만 +34:00/제작 01:04:00으로 바뀜) —
       늦게/일찍 끝남을 warning/success로 물들이던 건 참조와 다른 색이라 뺐다. */
    @keyframes tag-final-blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }
    .cd-runner-tag-pill.final-blink {
      animation: tag-final-blink 1s steps(1, end) infinite;
    }
    /* LIVE 확정되면(onAirIndex 기준) 알약을 참조 시안(Direction 3)의 One UI
       라이브 처리 그대로 흰 배경+검정 글자로 뒤집는다 — 화면 전체가 어두운
       상태에서 이 반전 자체가 "지금 진짜 방송 중"을 별도 뱃지 없이 강하게
       알려준다(참조 파일의 --tag-live-bg:#fff / --tag-live-fg:#000 그대로). */
    #cd-runner-tag.is-live .cd-runner-tag-pill {
      background: #ffffff;
      color: #000000;
    }
    .cd-runner-trail {
      position: absolute;
      top: 50%;
      right: 100%;
      width: clamp(80px, calc(var(--s) * 9vw), 267px);
      height: clamp(5px, calc(var(--s) * 0.7vh), 16px);
      transform: translateY(-50%);
      background: var(--accent);
      opacity: 0.35;
      border-radius: 6px;
      transition: background 0.2s ease, width 0.2s ease, opacity 0.2s ease;
    }
    /* 다음 방송이 아직 한참 남아 러너가 트랙 맨 앞에 멈춰있는 동안은 트레일을
       숨긴다 — 실제로 움직이고 있지 않은데 카드 여백을 주황으로 채워서
       왼쪽만 트랙에 딱 붙은 것처럼 보이는 비대칭 착시를 없앤다. */
    #cd-runner.walking.parked .cd-runner-trail { opacity: 0; }
    .cd-runner-ring {
      position: absolute;
      top: 50%;
      left: 0;
      width: clamp(14px, calc(var(--s) * 1.5vh), 38px);
      height: clamp(14px, calc(var(--s) * 1.5vh), 38px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid var(--accent);
      opacity: 0.55;
      pointer-events: none;
    }
    #cd-runner.walking .cd-runner-ring { animation: runner-ping 2.4s cubic-bezier(.2,.6,.35,1) infinite; }
    #cd-runner.running .cd-runner-ring {
      border-color: var(--accent);
      animation: runner-ping 1.1s cubic-bezier(.2,.6,.35,1) infinite;
    }
    #cd-runner.finished .cd-runner-ring { display: none; }
    .cd-runner-head {
      position: absolute;
      top: 50%;
      left: 0;
      width: clamp(14px, calc(var(--s) * 1.5vh), 38px);
      height: clamp(14px, calc(var(--s) * 1.5vh), 38px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--accent);
      transition: background 0.2s ease;
    }
    #cd-runner.walking .cd-runner-head { animation: runner-glow 2.4s ease-in-out infinite; }
    #cd-runner.running .cd-runner-head { animation: runner-glow 0.9s ease-in-out infinite; }
    #cd-runner.running .cd-runner-trail {
      background: var(--accent);
      opacity: 0.4;
      width: clamp(27px, calc(var(--s) * 2.6vw), 93px);
    }
    #cd-runner.running .cd-runner-head {
      background: var(--accent);
    }
    #cd-runner.finished .cd-runner-head {
      background: var(--accent);
      animation: none;
    }
    #cd-runner.finished .cd-runner-trail {
      background: var(--accent);
      opacity: 0.5;
    }

    @keyframes runner-ping {
      0%   { transform: translate(-50%, -50%) scale(0.85); opacity: 0.65; }
      100% { transform: translate(-50%, -50%) scale(2.3); opacity: 0; }
    }
    @keyframes runner-glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
      50%      { transform: translate(-50%, -50%) scale(1.07); filter: brightness(1.15); }
    }
    /* 다음 방송이 한참 남아 러너가 트랙 맨 앞에 멈춰있는 동안, 트레일을
       없앴더니(비대칭 착시 해결) 이번엔 러너가 아예 안 움직이는 것처럼
       보였다(사용자 피드백) — 진행 중이라는 착각은 주지 않으면서(위치는
       그대로 고정) "대기 중, 시스템은 살아있다"는 걸 눈에 띄게 알려주는
       숨쉬기 펄스로 대체(기존 walking 글로우/핑보다 더 뚜렷하게). */
    #cd-runner.walking.parked .cd-runner-head {
      animation: runner-parked-pulse 2.6s ease-in-out infinite;
    }
    #cd-runner.walking.parked .cd-runner-ring {
      animation: runner-parked-ring 2.6s ease-in-out infinite;
    }
    @keyframes runner-parked-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.4); }
    }
    @keyframes runner-parked-ring {
      0%        { transform: translate(-50%, -50%) scale(0.9); opacity: 0.55; }
      70%, 100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #cd-runner.walking.parked .cd-runner-head,
      #cd-runner.walking.parked .cd-runner-ring { animation: none; }
    }

    /* ── 세로 모드 (전체 화면 90도 회전) ───────────────────────── */
    body.portrait-right, body.portrait-left {
      position: fixed;
      top: calc(50vh - 50vw);
      left: calc(50vw - 50vh);
      width: 100vh;
      height: 100vw;
      min-height: unset;
      overflow: hidden;
    }
    body.portrait-right { transform: rotate(90deg); }
    body.portrait-left  { transform: rotate(-90deg); }

    /* 세로 모드: 양쪽 패널 동일 높이 → 시계 정 중앙. 컨트롤 페이지의 "박스 높이
       (세로)" 슬라이더 하나가 --p-box-scale로 세 요소 모두에 같이 걸려서,
       어떤 값을 넣어도 위아래 높이가 항상 같게 유지된다. */
    body.portrait-right #status-box,
    body.portrait-left  #status-box {
      flex: 0 0 clamp(90px, calc(var(--p-box-scale, 1) * 20vh), 320px);
      padding: clamp(10px, calc(var(--p-box-scale, 1) * 3vh), 46px) clamp(16px, 3vh, 40px);
    }
    body.portrait-right #status-text,
    body.portrait-left  #status-text {
      font-size: clamp(2.5rem, 5vh, 4.5rem);
    }
    body.portrait-right #schedule,
    body.portrait-left  #schedule,
    body.portrait-right #countdown,
    body.portrait-left  #countdown {
      flex: 0 0 clamp(90px, calc(var(--p-box-scale, 1) * 20vh), 320px);
      min-height: unset;
      overflow: hidden;
    }
    /* 세로모드는 가로모드보다 카드 높이가 훨씬 좁은데, 알약을 트랙 아래로
       옮기면서 위(라벨)+아래(알약) 두 곳에 여백이 필요해져 예전(위쪽 한 곳만)
       보다 세로 공간을 더 먹는다 — 좁은 세로 화면에서 알약이 잘리지 않도록
       라벨/알약 여백과 트랙 자체 크기를 줄여서 좁은 상자 안에 맞춘다. */
    body.portrait-right #cd-track,
    body.portrait-left  #cd-track {
      margin-top: clamp(30px, calc(var(--cd-text-scale, 1) * 3.6vh), 70px);
      margin-bottom: clamp(30px, calc(var(--cd-text-scale, 1) * 3.6vh), 70px);
      height: clamp(40px, calc(var(--s) * 4vh), 90px);
    }
    body.portrait-right .cd-marker-label,
    body.portrait-left  .cd-marker-label {
      margin-bottom: clamp(6px, calc(var(--s) * 0.7vh), 16px);
      font-size: clamp(0.9rem, calc(var(--cd-label-scale, 1) * 1vw), 1.9rem);
    }
    body.portrait-right .cd-runner-tag,
    body.portrait-left  .cd-runner-tag {
      top: calc(30% + clamp(8px, calc(var(--s) * 1vh), 22px));
    }
    body.portrait-right .cd-runner-tag-pill,
    body.portrait-left  .cd-runner-tag-pill {
      padding: clamp(3px, calc(var(--cd-text-scale, 1) * 0.35vh), 12px) clamp(8px, calc(var(--cd-text-scale, 1) * 0.9vw), 28px);
    }

    /* 세로 모드 시계: CSS 레벨에서 크기 초과 원천 차단.
       90도 회전 구조라 body의 flex-column이 쌓이는 실제 축은 화면상 "가로"(vw)다 —
       vh는 회전과 무관하게 항상 실제 뷰포트 높이를 가리키므로 여기선 예산 축이 아니다. */
    body.portrait-right #clock,
    body.portrait-left  #clock {
      font-size: min(var(--clock-fs, 8rem), 38vw) !important;
    }

    /* 전체화면 토글 — 원격 데스크톱/터치 환경에서 F11을 못 누를 때를 위한 탭 버튼 */
    #fs-toggle {
      position: fixed;
      right: 10px;
      bottom: 10px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--oneui-surface-2);
      color: var(--text-tertiary);
      font-size: 1.1rem;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      z-index: 9999;
      transition: background 0.2s ease, color 0.2s ease;
    }
    #fs-toggle:hover, #fs-toggle:active {
      background: var(--oneui-surface);
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <button id="fs-toggle" type="button" title="전체화면 전환">⛶</button>

  <!-- 상태 박스 (아날로그 탈리 램프) -->
  <div id="status-box">
    <span id="status-text">ON AIR</span>
  </div>

  <!-- 시계 + 날짜 + 날씨 -->
  <div id="center">
    <div id="clock"><span id="clock-time">--:--:--</span><span id="clock-meridiem"></span></div>
    <div id="info-row">
      <div id="date">----년 --월 --일 (--)</div>
      <div class="divider"></div>
      <div id="weather">
        <span id="weather-icon">🌡</span>
        <span id="weather-text">날씨 불러오는 중…</span>
      </div>
    </div>
  </div>

  <!-- 캘린더 타임라인 -->
  <div id="schedule">
    <div class="sch-slot prev"  id="sch-prev">
      <span class="sch-label">이전</span>
      <span class="sch-timerange" id="sch-prev-time">—</span>
      <span class="sch-name"     id="sch-prev-name"><span class="sch-none">일정 없음</span></span>
    </div>
    <div class="sch-slot current" id="sch-current">
      <span class="sch-label">현재</span>
      <span class="sch-timerange" id="sch-cur-time">—</span>
      <span class="sch-name"      id="sch-cur-name"><span class="sch-none">일정 없음</span></span>
    </div>
    <div class="sch-slot next"   id="sch-next">
      <span class="sch-label">다음</span>
      <span class="sch-timerange" id="sch-next-time">—</span>
      <span class="sch-name"      id="sch-next-name"><span class="sch-none">일정 없음</span></span>
    </div>
  </div>

  <!-- 방송 시작 카운트다운 -->
  <div id="countdown">
    <div id="cd-track">
      <div id="cd-track-line"></div>
      <div id="cd-fill"></div>
      <div class="cd-marker" id="cd-marker-start">
        <span class="cd-marker-dot"></span>
        <span class="cd-marker-label">
          <span class="cd-marker-title-row"><span class="cd-marker-program" id="cd-marker-start-program"></span><span class="cd-live-badge" id="cd-live-badge">LIVE</span></span>
          <span id="cd-marker-start-label">시작</span>
        </span>
      </div>
      <div class="cd-marker" id="cd-marker-end">
        <span class="cd-marker-dot"></span>
        <span class="cd-marker-label">
          <span class="cd-marker-program" id="cd-marker-end-program"></span>
          <span id="cd-marker-end-label">종료</span>
        </span>
      </div>
      <div id="cd-runner" class="walking">
        <span class="cd-runner-trail"></span>
        <span class="cd-runner-ring"></span>
        <span class="cd-runner-head"></span>
      </div>
      <!-- 참조 시안(Direction 3)처럼 러너 위 말풍선이 아니라 트랙 아래 알약 —
           #cd-runner의 형제로 두고 #cd-track 기준 absolute left(px)를 JS가
           매 틱 갱신한다(트랙 폭 안으로 clamp, renderBoundedTrack() 참고). -->
      <div class="cd-runner-tag" id="cd-runner-tag">
        <span class="cd-runner-tag-pill" id="cd-runner-tag-text">
          <span class="cd-tag-main-row">
            <span class="cd-live-dot" id="cd-live-dot"></span>
            <span class="cd-tag-main" id="cd-tag-main">--:--</span>
          </span>
          <span class="cd-tag-sub" id="cd-tag-sub"></span>
        </span>
      </div>
    </div>
  </div>

  <!-- 타이머 + 스톱워치 -->
  <div id="stopwatch">
    <div class="tm-col" id="timer-col">
      <div class="tm-label-row">
        <span class="tm-dot" id="timer-dot"></span>
        <span class="tm-label" id="timer-label">타이머</span>
      </div>
      <span class="tm-value" id="timer-value">-05:00</span>
    </div>
    <div class="tm-divider"></div>
    <div class="tm-col" id="stopwatch-col">
      <div class="tm-label-row">
        <span class="tm-dot" id="stopwatch-dot"></span>
        <span class="tm-label" id="stopwatch-label">스톱워치</span>
      </div>
      <span class="tm-value" id="stopwatch-timer">+00:00</span>
    </div>
  </div>

<script>
  const box         = document.getElementById('status-box');
  const statusText  = document.getElementById('status-text');
  const scheduleEl  = document.getElementById('schedule');
  const countdownEl = document.getElementById('countdown');
  const stopwatchEl = document.getElementById('stopwatch');
  const clockEl     = document.getElementById('clock');
  const clockTimeEl = document.getElementById('clock-time');
  const clockMeridiemEl = document.getElementById('clock-meridiem');
  let clock12Hour = true; // 기본값 12시간제(AM/PM) — settings.json에 값이 아직 없어도 이게 기본
  const infoRow     = document.getElementById('info-row');
  const dateEl      = document.getElementById('date');
  const weatherIcon = document.getElementById('weather-icon');
  const weatherText = document.getElementById('weather-text');
  const cdTagMain   = document.getElementById('cd-tag-main');
  const cdTagSub    = document.getElementById('cd-tag-sub');
  const cdTrack     = document.getElementById('cd-track');
  const cdFill      = document.getElementById('cd-fill');
  const cdRunner    = document.getElementById('cd-runner');
  const cdMarkerStart      = document.getElementById('cd-marker-start');
  const cdMarkerStartLabel = document.getElementById('cd-marker-start-label');
  const cdMarkerEndLabel   = document.getElementById('cd-marker-end-label');
  const cdMarkerStartProgram = document.getElementById('cd-marker-start-program');
  const cdMarkerEndProgram   = document.getElementById('cd-marker-end-program');
  const cdRunnerTagEl        = document.getElementById('cd-runner-tag');
  const cdRunnerTagPill      = document.getElementById('cd-runner-tag-text');
  const cdLiveDot            = document.getElementById('cd-live-dot');
  const cdLiveBadge          = document.getElementById('cd-live-badge');
  const stopwatchCol     = document.getElementById('stopwatch-col');
  const stopwatchLabel   = document.getElementById('stopwatch-label');
  const stopwatchTimerEl = document.getElementById('stopwatch-timer');
  const timerCol   = document.getElementById('timer-col');
  const timerLabel = document.getElementById('timer-label');
  const timerValueEl = document.getElementById('timer-value');

  const DAYS = ['일','월','화','수','목','금','토'];

  function isPortraitMode() {
    return document.body.classList.contains('portrait-right') ||
           document.body.classList.contains('portrait-left');
  }

  /* ── 배율 기준값 (설정 페이지와 동일) ─────────────────────────── */
  // 시계 기준값을 13→15.5로 올림 — #center가 flex:1이라 시계 위아래로
  // 화면 여백을 전부 가져가는데, 시계 자체가 작으니 그 여백이 "의도된
  // 여백"이 아니라 "그냥 남는 공간"처럼 보였다(실측 스크린샷으로 확인).
  // 시계를 키워서 그 공간을 실제 콘텐츠로 채운다 — 실측 폭 제한(가로폭
  // 넘으면 자동 축소)은 그대로라 작은 화면에서도 안전하다.
  const CLOCK_BASELINE   = 15.5;
  const TALLY_BASELINE   = 5;
  const SCH_BASELINE     = 1.3;
  const P_CLOCK_BASELINE = 12;
  const P_TALLY_BASELINE = 4;
  const P_SCH_BASELINE   = 1.2;

  /* ── 화면에 적용되는 현재 설정값 (컨트롤 페이지에서 폴링으로 받아옴) ─ */
  let timeOffsetSec  = 0;
  let clockScale = 1, tallyScale = 1, schScale = 1, schBoxScale = 1;
  let tallyBoxScale = 1, clockBoxScale = 1;
  let pClockScale = 1, pTallyScale = 1, pSchScale = 1, pBoxScale = 1;
  let calTs5On = true, calTs5bOn = true;
  let customCalUrl = '', customCalOn = false;
  let countdownModeOn = false, stopwatchModeOn = false;
  let scheduleVisible = true;
  let broadcastTime = '', broadcastEndTime = '';
  let broadcastTimeNextDay = false, broadcastEndTimeNextDay = false;
  let broadcastProgramName = '';
  let broadcastVideoSource = '';
  let broadcastScheduledEndTime = '', broadcastScheduledEndTimeNextDay = false;
  let broadcastIsLive = false;
  let broadcastStartConfirmed = true;
  let lastCdSignature = '';
  let cdBoxScale = 1, cdTextScale = 1, cdLabelScale = 1;
  let swBoxScale = 1, swTextScale = 1;
  let pCdScale = 1, pSwScale = 1;

  function getNow() {
    return new Date(Date.now() + timeOffsetSec * 1000);
  }

  /* ── 크기 실제 적용 (가로/세로 공용) ───────────────────────── */
  // 슬라이더가 낸 값을 그대로 쓰되, 렌더링된 실제 너비가 화면 예산을 넘으면
  // 그 실측값 기준으로만 줄인다 — 화면 높이의 N%라는 식의 사전 상한선은 두지
  // 않는다(예: 예전엔 1080px 화면에서 시계 슬라이더 상단 60%가 사전 상한에
  // 막혀 아무 효과가 없었다). 실측 후 보정이라 어떤 화면 크기에서도 슬라이더가
  // 낼 수 있는 값까지는 항상 그대로 반영된다.
  function setClockFontSize(rem) {
    if (isPortraitMode()) {
      // 90도 회전 구조라 두 축이 뒤바뀐다:
      // - #clock의 '너비'(8ch, 로컬 좌표)는 화면에선 '세로' 길이가 됨 → innerHeight 기준 제한
      // - #center가 상태박스/일정과 나눠쓰는 '쌓임 축' 예산은 화면상 '가로' → innerWidth 기준 제한
      clockEl.style.transform = '';
      clockEl.style.removeProperty('font-size');
      clockEl.style.setProperty('--clock-fs', rem + 'rem');
      const maxPx = window.innerHeight - 120;
      const w = clockEl.offsetWidth;
      if (w > maxPx) {
        clockEl.style.setProperty('--clock-fs', (rem * maxPx / w) + 'rem');
      }
    } else {
      clockEl.style.removeProperty('--clock-fs');
      clockEl.style.transform = '';
      clockEl.style.fontSize = rem + 'rem';
      const maxPx = window.innerWidth - 80;
      const w = clockEl.offsetWidth;
      if (w > maxPx) {
        clockEl.style.fontSize = (rem * maxPx / w) + 'rem';
      }
    }
  }
  function setTallyFontSize(rem) {
    if (isPortraitMode()) {
      statusText.style.fontSize = rem + 'rem';
      const maxPx = window.innerHeight - 80;
      const w = statusText.offsetWidth;
      if (w > maxPx) {
        statusText.style.fontSize = (rem * maxPx / w) + 'rem';
      }
    } else {
      statusText.style.fontSize = rem + 'rem';
      const maxPx = window.innerWidth - 80;
      const w = statusText.offsetWidth;
      if (w > maxPx) {
        statusText.style.fontSize = (rem * maxPx / w) + 'rem';
      }
    }
  }
  function setSchFontSize(rem) {
    scheduleEl.style.setProperty('--sch-scale', (rem / SCH_BASELINE).toFixed(3));
    document.querySelectorAll('.sch-name').forEach(el => el.style.fontSize = rem + 'rem');
    document.querySelectorAll('.sch-timerange').forEach(el => {
      const tRem = rem * 0.75;
      el.style.fontSize = tRem + 'rem';
      const maxPx = el.parentElement.clientWidth;
      if (el.scrollWidth > maxPx) el.style.fontSize = (tRem * maxPx / el.scrollWidth) + 'rem';
    });
  }

  function applyLandscapeSizes() {
    if (isPortraitMode()) return;
    setClockFontSize(CLOCK_BASELINE * clockScale);
    setTallyFontSize(TALLY_BASELINE * tallyScale);
    setSchFontSize(SCH_BASELINE * schScale);
  }
  function applyPortraitSizes() {
    if (!isPortraitMode()) return;
    setClockFontSize(P_CLOCK_BASELINE * pClockScale);
    setTallyFontSize(P_TALLY_BASELINE * pTallyScale);
    setSchFontSize(P_SCH_BASELINE * pSchScale);
    // 위(탈리)·아래(일정 또는 생방송) 패널은 시계가 정중앙에 오도록 항상 같은
    // 높이를 유지해야 해서, 세 요소 모두에 같은 배율을 건다(개별 배율을 쓰면
    // 위아래 높이가 달라져 시계가 한쪽으로 치우친다).
    const v = pBoxScale.toFixed(3);
    box.style.setProperty('--p-box-scale', v);
    scheduleEl.style.setProperty('--p-box-scale', v);
    countdownEl.style.setProperty('--p-box-scale', v);
  }

  // 생방송·타이머 위젯은 가로 모드에선 항목별로 여러 슬라이더(박스 높이/글자
  // 크기 등)로 나뉘어 있지만, 세로 모드는 다른 요소들과 마찬가지로 슬라이더
  // 하나로 전체를 같이 조절한다 — 세로일 땐 세로 전용 값을, 가로일 땐 기존
  // 개별 값들을 그대로 쓴다. isPortraitMode()를 그때그때 다시 확인하므로 방향
  // 전환 직후에 호출해도 항상 맞는 값이 적용된다.
  function applyCdSize() {
    if (isPortraitMode()) {
      countdownEl.style.setProperty('--cd-box-scale', pCdScale.toFixed(3));
      countdownEl.style.setProperty('--cd-text-scale', pCdScale.toFixed(3));
      countdownEl.style.setProperty('--cd-label-scale', pCdScale.toFixed(3));
    } else {
      countdownEl.style.setProperty('--cd-box-scale', cdBoxScale.toFixed(3));
      countdownEl.style.setProperty('--cd-text-scale', cdTextScale.toFixed(3));
      countdownEl.style.setProperty('--cd-label-scale', cdLabelScale.toFixed(3));
    }
  }
  function applySwSize() {
    if (isPortraitMode()) {
      stopwatchEl.style.setProperty('--sw-box-scale', pSwScale.toFixed(3));
      stopwatchEl.style.setProperty('--sw-text-scale', pSwScale.toFixed(3));
    } else {
      stopwatchEl.style.setProperty('--sw-box-scale', swBoxScale.toFixed(3));
      stopwatchEl.style.setProperty('--sw-text-scale', swTextScale.toFixed(3));
    }
  }

  /* ── 시계 & 날짜 ─────────────────────────────────────────────── */
  function updateClock() {
    const n = getNow();
    const pad = v => String(v).padStart(2, '0');
    if (clock12Hour) {
      let h12 = n.getHours() % 12;
      if (h12 === 0) h12 = 12;
      clockTimeEl.textContent = `${pad(h12)}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
      clockMeridiemEl.textContent = n.getHours() < 12 ? 'AM' : 'PM';
    } else {
      clockTimeEl.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
      clockMeridiemEl.textContent = '';
    }
    dateEl.textContent =
      `${n.getFullYear()}년 ${pad(n.getMonth()+1)}월 ${pad(n.getDate())}일 (${DAYS[n.getDay()]})`;
  }
  updateClock();

  /* ── 날씨 ────────────────────────────────────────────────────── */
  const WMO = {
    0:'☀️ 맑음', 1:'🌤 대체로 맑음', 2:'⛅ 부분 흐림', 3:'☁️ 흐림',
    45:'🌫 안개', 48:'🌫 안개',
    51:'🌦 이슬비', 53:'🌦 이슬비', 55:'🌦 이슬비',
    61:'🌧 비', 63:'🌧 비', 65:'🌧 강한 비',
    71:'🌨 눈', 73:'🌨 눈', 75:'❄️ 강한 눈', 77:'❄️ 눈보라',
    80:'🌧 소나기', 81:'🌧 소나기', 82:'⛈ 강한 소나기',
    95:'⛈ 뇌우', 96:'⛈ 뇌우(우박)', 99:'⛈ 강한 뇌우',
  };
  function fetchWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,weathercode&timezone=auto`;
    fetch(url)
      .then(r => r.json())
      .then(d => {
        const temp = Math.round(d.current.temperature_2m);
        const desc = WMO[d.current.weathercode] ?? '날씨 정보 없음';
        const [icon, ...words] = desc.split(' ');
        weatherIcon.textContent = icon;
        weatherText.textContent = `${words.join(' ')}  ${temp}°C`;
      })
      .catch(() => { weatherIcon.textContent = '—'; weatherText.textContent = '날씨 정보 없음'; });
  }
  function loadWeather() {
    if (navigator.geolocation)
      navigator.geolocation.getCurrentPosition(
        p => fetchWeather(p.coords.latitude, p.coords.longitude),
        ()  => fetchWeather(37.5665, 126.9780)
      );
    else fetchWeather(37.5665, 126.9780);
  }
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);

  /* ── 캘린더 타임라인 ─────────────────────────────────────────── */
  function getCalendarUrl() {
    const params = [];
    if (calTs5On)  params.push('cal=TS-5');
    if (calTs5bOn) params.push('cal=TS-5(%EB%B0%A9%EC%86%A1)');
    if (customCalOn && customCalUrl) params.push('customCal=' + encodeURIComponent(customCalUrl));
    params.push('offset=' + timeOffsetSec);
    return '/calendar?' + params.join('&');
  }
  function setSlot(timeEl, nameEl, ev) {
    if (ev) {
      timeEl.textContent = ev.allday ? '종일' : `${ev.start} – ${ev.end}`;
      nameEl.textContent = ev.summary;
    } else {
      timeEl.textContent = '—';
      nameEl.innerHTML = '<span class="sch-none">일정 없음</span>';
    }
  }
  function loadSchedule() {
    fetch(getCalendarUrl())
      .then(r => r.json())
      .then(d => {
        setSlot(document.getElementById('sch-prev-time'), document.getElementById('sch-prev-name'), d.prev);
        setSlot(document.getElementById('sch-cur-time'),  document.getElementById('sch-cur-name'),  d.current);
        setSlot(document.getElementById('sch-next-time'), document.getElementById('sch-next-name'), d.next);
      })
      .catch(() => {});
  }
  loadSchedule();
  setInterval(loadSchedule, 60 * 1000);

  /* ── 하단 표시 모드 전환 (일정 / 카운트다운 / 스톱워치) ───────── */
  function applyBottomDisplay() {
    scheduleEl.style.display  = (!countdownModeOn && !stopwatchModeOn && scheduleVisible) ? 'grid' : 'none';
    countdownEl.style.display = countdownModeOn ? 'flex' : 'none';
    stopwatchEl.style.display = stopwatchModeOn ? 'flex' : 'none';
  }

  /* ── 방송 시작 카운트다운 ───────────────────────────────────── */
  const CD_LEAD_SEC = 15 * 60;
  let cdWasBeforeStart = null;
  let cdWasOverrun = false;
  let cdWasFinalEnded = false;
  let cdFinalBlinkTimer = null;

  // 진단용: 카운트다운 숫자가 1초보다 크게 튀는 순간(예: -5 -4 -2 -1 처럼 하나
  // 빠지는 현상)을 브라우저가 스스로 감지해 서버로 보고한다 — 추측 대신 실제
  // 발생 순간의 정황(직전 틱과의 실제 간격, 폴링 직후였는지)을 증거로 남기기 위함.
  let cdTickLastSec = null;
  let cdTickLastWallMs = null;
  function reportTickAnomaly(detail) {
    try {
      const blob = new Blob([JSON.stringify(detail)], { type: 'application/json' });
      navigator.sendBeacon('/tick-anomaly', blob);
    } catch (e) {}
  }
  function checkTickContinuity(curSec, fromPoll) {
    const wallMs = Date.now();
    if (cdTickLastSec !== null && cdTickLastWallMs !== null) {
      const wallDeltaMs = wallMs - cdTickLastWallMs;
      // 실제 경과 시간(wallDeltaMs)만큼 초 값도 같이 움직였어야 정상 —
      // 그보다 훨씬 크게(500ms 이상 여유를 둬도) 뛰었으면 스킵이 의심된다.
      const secDelta = Math.abs(curSec - cdTickLastSec);
      const expectedMaxSteps = Math.ceil(wallDeltaMs / 1000) + 1;
      if (wallDeltaMs < 2500 && secDelta > expectedMaxSteps) {
        reportTickAnomaly({
          prevSec: cdTickLastSec, curSec, secDelta,
          wallDeltaMs, fromPoll: !!fromPoll,
          timeOffsetSec, broadcastStartConfirmed,
        });
      }
    }
    cdTickLastSec = curSec;
    cdTickLastWallMs = wallMs;
  }

  function triggerStartHit() {
    const dotEl = cdMarkerStart.querySelector('.cd-marker-dot');
    dotEl.classList.remove('hit');
    void dotEl.offsetWidth;
    dotEl.classList.add('hit');
  }

  function triggerOverrunHit() {
    cdRunnerTagPill.classList.remove('overrun-hit');
    void cdRunnerTagPill.offsetWidth;
    cdRunnerTagPill.classList.add('overrun-hit');
  }

  function formatDuration(totalSec) {
    totalSec = Math.max(0, Math.round(totalSec));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = v => String(v).padStart(2, '0');
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function pad2(v) { return String(v).padStart(2, '0'); }
  function hhmm(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // 참조 시안(Direction 3)처럼 프로그램명(진하게)과 스튜디오 태그(연한 회색,
  // 얇게)를 색으로 구분한다 — 예전엔 한 텍스트로 합쳐서 스타일을 따로
  // 못 줬었다.
  function programLabel() {
    const studio = broadcastVideoSource
      ? `<span class="cd-marker-studio">(${escapeHtml(broadcastVideoSource)})</span>` : '';
    return escapeHtml(broadcastProgramName) + studio;
  }
  function timeToday(now, hhmmStr, nextDay) {
    const [h, m, s] = hhmmStr.split(':').map(Number);
    const d = new Date(now);
    d.setHours(h, m, s || 0, 0);
    if (nextDay) d.setDate(d.getDate() + 1);
    return d;
  }

  function anchorBroadcastWindow(now, startVal, startNextDay, endVal, endNextDay) {
    // HH:MM:SS 문자열엔 날짜가 없어서, timeToday()로 "오늘 그 시각"에 앉히면 자정을
    // 넘겨서까지 진행 중인 방송을 자정 이후에 볼 때 시작 시각이 "오늘 저녁(=아직
    // 안 됨)"으로 재해석돼 실제로는 진행 중인데 "시작 전"처럼 보이는 문제가 있었다.
    // 시작~종료 사이 실제 길이(durationMs)는 두 시각과 N 플래그만으로 날짜와 무관하게
    // 정확히 구해지므로, 그 길이를 유지한 채 now와 가장 가까운(또는 지금 그 구간
    // 안에 있는) 날짜로 통째로 옮겨 앉힌다.
    const baseStart = timeToday(now, startVal, startNextDay);
    // endNextDay는 "종료가 now 기준" 며칠 뒤가 아니라 "시작(start) 기준" 며칠 뒤인지이므로,
    // baseStart를 기준 삼아 앉혀야 한다 — now를 기준으로 하면 시작 자체가 내일인 경우
    // (아래 dayOffset 탐색 이전에) 종료가 오늘 기준으로 계산되어 시작보다 앞서버린다.
    const baseEnd = endVal ? timeToday(baseStart, endVal, endNextDay) : null;
    const durationMs = baseEnd ? baseEnd - baseStart : 0;

    let bestStart = baseStart, bestDist = Infinity;
    for (const dayOffset of [-1, 0, 1]) {
      const s = new Date(baseStart);
      s.setDate(s.getDate() + dayOffset);
      const e = baseEnd ? new Date(s.getTime() + durationMs) : s;
      const dist = now < s ? (s - now) : (now >= e ? (now - e) : 0);
      if (dist < bestDist) { bestDist = dist; bestStart = s; }
    }
    return { start: bestStart, end: baseEnd ? new Date(bestStart.getTime() + durationMs) : null };
  }

  function isDifferentDay(d, ref) {
    return d.getFullYear() !== ref.getFullYear() || d.getMonth() !== ref.getMonth() || d.getDate() !== ref.getDate();
  }

  function updateCountdown(fromPoll) {
    if (!countdownModeOn) return;
    const startVal = broadcastTime;
    const endVal   = broadcastEndTime;
    const now = getNow();

    if (!startVal) {
      cdTagMain.textContent = '--:--';
      cdTagSub.classList.remove('show');
      countdownEl.classList.remove('elapsed');
      cdTrack.classList.remove('show');
      cdTickLastSec = null;
      cdTickLastWallMs = null;
      return;
    }

    cdRunnerTagEl.classList.toggle('is-live', broadcastIsLive);
    cdLiveDot.classList.toggle('show', broadcastIsLive);
    // broadcastIsLive는 sps_listener가 onAirIndex(주조→부조 실제 컷팅)를 실시간으로
    // 확인해서 반영하는 값 — 그 값 그대로 프로그램명 옆에 LIVE 뱃지를 띄운다.
    cdLiveBadge.classList.toggle('show', broadcastIsLive);

    const { start, end } = anchorBroadcastWindow(now, startVal, broadcastTimeNextDay, endVal, broadcastEndTimeNextDay);
    const rawDiffMs = start - now;
    checkTickContinuity(Math.round(rawDiffMs / 1000), fromPoll);

    if (rawDiffMs > 0) {
      cdTagMain.textContent = '-' + formatDuration(Math.floor(rawDiffMs / 1000));
      cdTagSub.classList.remove('show');
      countdownEl.classList.remove('elapsed');
    } else {
      cdTagMain.textContent = '+' + formatDuration(Math.floor(-rawDiffMs / 1000));
      countdownEl.classList.add('elapsed');
    }

    if (!endVal || !end) {
      cdTagSub.classList.remove('show');
      cdTrack.classList.remove('show');
      return;
    }
    const durationSec = (end - start) / 1000;
    if (durationSec <= 0) {
      cdTagSub.classList.remove('show');
      cdTrack.classList.remove('show');
      return;
    }
    cdTrack.classList.add('show');
    // 저장된 NextDay 플래그는 sps_listener가 감지한 시점 기준이라, 자정을 넘겨서도
    // (아직 같은 방송을 가리키는 동안엔) 갱신되지 않을 수 있다 — 라벨의 "N"은 항상
    // anchorBroadcastWindow가 실제로 앉힌 날짜를 now와 비교해 그때그때 판단한다.
    // 앞에 몇 분 안으로 바로 이어지는 생방송이 없으면(오늘 첫 방송 등) 애초에
    // 캐스케이드로 흔들릴 상대가 없어 서버가 처음부터 확정으로 본다. 있으면 그
    // 앞 방송이 실제로 끝나야(서버가 onAirIndex로 판단) 확정 — 그 전까지만
    // 잠깐 체크 표시가 빠진다(모닝와이드1→2→3부, 뉴스헌터스→8뉴스 등).
    const confirmedMark = broadcastStartConfirmed
      ? ' <span class="cd-confirmed-mark" title="더는 안 바뀔 것으로 확인된 시작 시각">✓</span>' : '';
    const durationMin = Math.round(durationSec / 60);
    cdMarkerStartLabel.innerHTML = (isDifferentDay(start, now) ? 'N ' : '') + hhmm(start)
      + `<span class="cd-marker-assigned">(${durationMin})</span>` + confirmedMark;
    cdMarkerStartProgram.innerHTML = programLabel();
    renderBoundedTrack(now, start, end, durationSec);
  }

  function renderBoundedTrack(now, start, end, durationSec) {
    // 큰 글씨(주 라벨)는 항상 "예정" 종료를 고정해서 보여준다 — 실제값이 반영돼도
    // 자리에서 숫자가 바뀌지 않아야 기준점 역할을 한다. 진행률 바/러너/남은시간
    // 계산은 계속 최신값(end, 방송 중엔 예정=최신이라 같고 끝나면 실제)을 쓴다.
    const scheduledEnd = broadcastScheduledEndTime
      ? timeToday(start, broadcastScheduledEndTime, broadcastScheduledEndTimeNextDay) : end;
    cdMarkerEndLabel.textContent = (isDifferentDay(scheduledEnd, now) ? 'N ' : '') + hhmm(scheduledEnd);
    cdMarkerEndProgram.innerHTML = programLabel();

    // 방송이 실제로 끝났으면(=LIVE가 꺼지고 예정과 실제 종료가 달라지면) 그
    // 사실을 우하단 텍스트가 아니라 말풍선 자체로 보여준다 — 끝난 뒤엔 말풍선의
    // 경과/남음 표시가 더 이상 의미가 없어지는 자리이기 때문(아래 pill 렌더링 참고).
    let isFinalEnded = false, finalDiffSec = 0;
    if (broadcastScheduledEndTime && !broadcastIsLive) {
      const diffSec = Math.round((end - scheduledEnd) / 1000);
      if (Math.abs(diffSec) >= 1) {
        isFinalEnded = true;
        finalDiffSec = diffSec;
      }
    }

    const isBeforeStart = now < start;

    // 시작점을 지나면 트랙 좌표계를 '시작~종료'로 재구성 — 리드인 구간이 차지하던 공간을
    // 되찾아 트랙이 화면 전체 폭으로 길어진다 (크로싱 순간에만 cross-anim으로 부드럽게 전환).
    let startPct, pct;
    if (isBeforeStart) {
      const leadSec    = Math.min(CD_LEAD_SEC, durationSec);
      const trackStart = new Date(start.getTime() - leadSec * 1000);
      startPct = (leadSec / (leadSec + durationSec)) * 100;
      const totalSec = (end - trackStart) / 1000;
      const elapsedFromTrackStart = (now - trackStart) / 1000;
      pct = Math.max(0, Math.min(1, elapsedFromTrackStart / totalSec)) * 100;
    } else {
      startPct = 0;
      pct = Math.max(0, Math.min(1, (now - start) / (end - start))) * 100;
    }
    // cross-anim 클래스는 반드시 left/width 값을 바꾸기 '전'에 붙여야 함 — 나중에 붙이면
    // 브라우저가 이미 기본(0.9s linear) 트랜지션으로 애니메이션을 시작해버려 러너만 처지는
    // 현상이 생긴다(마커·채움바와 속도가 어긋나 보였던 원인).
    const justCrossed = cdWasBeforeStart === true && !isBeforeStart;
    if (justCrossed) {
      cdRunner.classList.add('cross-anim');
      cdFill.classList.add('cross-anim');
      setTimeout(() => {
        cdRunner.classList.remove('cross-anim');
        cdFill.classList.remove('cross-anim');
      }, 850);
    }

    if (!cdTrackWidthPx) cdTrackWidthPx = cdTrack.getBoundingClientRect().width;

    cdMarkerStart.style.left = startPct + '%';
    cdRunner.style.transform = 'translateX(' + (pct / 100 * cdTrackWidthPx) + 'px)';

    // [ADDED] .cd-runner-tag는 이제 #cd-runner 안이 아니라 #cd-track의 형제로
    // 옮겨져 있어(참조 시안처럼 러너 위 말풍선 대신 트랙 아래 알약), 러너의
    // 0px짜리 박스에 기대는 CSS transform:translateX(-50%) 중앙정렬 대신 여기서
    // 직접 트랙 폭 안으로 clamp된 절대 left 픽셀을 넣어준다 — 러너가 트랙
    // 양끝 근처에 있을 때 알약이 트랙 밖으로 넘치던 문제의 실제 해결책.
    const runnerXPx = pct / 100 * cdTrackWidthPx;
    const tagWidthPx = cdRunnerTagEl.offsetWidth;
    const tagXPx = Math.max(0, Math.min(cdTrackWidthPx - tagWidthPx, runnerXPx - tagWidthPx / 2));
    cdRunnerTagEl.style.left = tagXPx + 'px';
    // 시작점 진입 순간의 cross-anim(빠른 easing)도 러너와 같은 타이밍으로 —
    // 위에서 이미 cdRunner에 붙여둔 클래스 상태를 그대로 옮겨 반영할 뿐, 그
    // 클래스를 붙이고 떼는 원래 로직(justCrossed 블록)은 건드리지 않는다.
    cdRunnerTagEl.classList.toggle('cross-anim', cdRunner.classList.contains('cross-anim'));

    if (!isBeforeStart && isFinalEnded) {
      // 끝난 뒤엔 경과/남음 두 줄 대신, 예정보다 얼마나 늦게(+)/일찍(-) 끝났는지
      // 한 줄로 보여준다. 처음 이 상태가 된 순간만 10초간 반짝여서 알리고,
      // 이후엔 계속 깜빡이지 않고 고정 표시(전환 대기 동안 계속 깜빡이면 방해가 됨).
      const sign = finalDiffSec > 0 ? '+' : '-';
      cdTagMain.textContent = sign + formatDuration(Math.abs(finalDiffSec));
      cdTagMain.classList.toggle('final-over', finalDiffSec > 0);
      cdTagMain.classList.toggle('final-under', finalDiffSec < 0);
      // 참조 시안(Direction 3)의 종료 상태 알약처럼 아랫줄엔 총 제작(실제
      // 방송) 시간을 보여준다 — end는 방송이 실제로 꺼진 순간의 실제값이라
      // (end - start)가 곧 실제 방송 길이다.
      cdTagSub.textContent = '제작 ' + formatDuration(Math.max(0, Math.round((end - start) / 1000)));
      cdTagSub.classList.add('show');
      cdTagSub.classList.remove('overrun');
      cdLiveDot.classList.remove('show');
      if (!cdWasFinalEnded) {
        cdRunnerTagPill.classList.add('final-blink');
        clearTimeout(cdFinalBlinkTimer);
        cdFinalBlinkTimer = setTimeout(() => cdRunnerTagPill.classList.remove('final-blink'), 10000);
      }
      cdWasFinalEnded = true;
      cdWasOverrun = false;
    } else {
      if (cdWasFinalEnded) {
        cdRunnerTagPill.classList.remove('final-blink');
        clearTimeout(cdFinalBlinkTimer);
      }
      cdWasFinalEnded = false;
      cdTagMain.classList.remove('final-over', 'final-under');
      if (!isBeforeStart) {
        const isOverrun = broadcastIsLive && now > scheduledEnd;
        if (isOverrun) {
          const overrunSec = Math.floor((now - scheduledEnd) / 1000);
          cdTagSub.textContent = '+' + formatDuration(overrunSec);
          cdTagSub.classList.add('overrun');
          if (!cdWasOverrun) triggerOverrunHit();
        } else {
          const remainSec = Math.max(0, Math.floor((end - now) / 1000));
          cdTagSub.textContent = '-' + formatDuration(remainSec);
          cdTagSub.classList.remove('overrun');
        }
        cdWasOverrun = isOverrun;
        cdTagSub.classList.add('show');
      } else {
        cdTagSub.classList.remove('show', 'overrun');
        cdWasOverrun = false;
      }
    }

    if (justCrossed) {
      triggerStartHit();
    }
    cdWasBeforeStart = isBeforeStart;
    cdMarkerStart.classList.toggle('crossed', !isBeforeStart);

    if (now < start) {
      // 예전엔 방송 시작 전(대기)엔 채움을 아예 0으로 뒀는데, 러너 자체는
      // 이미 강조색이라 "러너는 주황인데 지나온 트랙은 계속 회색"인 게
      // 어색해 보였다(사용자 피드백) — 러너가 실제로 지나온 만큼(트랙
      // 맨 앞부터 현재 위치까지)은 대기 중에도 채워지게 한다.
      cdFill.style.left = '0%';
      cdFill.style.width = pct + '%';
      cdRunner.classList.remove('running', 'finished');
      cdRunner.classList.add('walking');
      // 다음 방송이 리드인 구간(CD_LEAD_SEC)에도 아직 안 들어와서 러너가
      // 트랙 맨 앞(0%)에 몇 시간이고 멈춰있는 경우, 러너 트레일이 카드
      // 왼쪽 여백 전체를 주황으로 채워버려서 오른쪽 여백이랑 비대칭으로
      // 보였다(사용자 피드백, 실측으로 좌표 자체는 대칭임을 확인) —
      // 트랙 맨 앞에 "멈춰" 있을 때는 트레일을 숨긴다.
      cdRunner.classList.toggle('parked', pct <= 0);
    } else if (now < end) {
      cdFill.style.left = startPct + '%';
      cdFill.style.width = Math.max(0, pct - startPct) + '%';
      cdRunner.classList.remove('walking', 'finished', 'parked');
      cdRunner.classList.add('running');
    } else {
      cdFill.style.left = startPct + '%';
      cdFill.style.width = (100 - startPct) + '%';
      cdRunner.classList.remove('walking', 'running', 'parked');
      cdRunner.classList.add('finished');
    }

  }

  let cdTrackWidthPx = 0;
  window.addEventListener('resize', () => { cdTrackWidthPx = 0; });

  /* ── 스톱워치 + 타이머 (서버 상태 기준 — 컨트롤 페이지와 공유) ─── */
  let swRunning = false, swElapsedMs = 0, swStartedAt = null;

  function formatStopwatch(ms) {
    const totalSec = Math.floor(Math.max(0, ms) / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = v => String(v).padStart(2, '0');
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function swCurrentElapsedMs() {
    return swElapsedMs + (swRunning && swStartedAt ? Date.now() - swStartedAt : 0);
  }
  function updateStopwatchDisplay() {
    stopwatchTimerEl.textContent = '+' + formatStopwatch(swCurrentElapsedMs());
    stopwatchCol.classList.toggle('running', swRunning);
    stopwatchLabel.textContent = swRunning ? '스톱워치 진행중' : '스톱워치';
  }

  let timerDurationSec = 300, timerRunning = false, timerRemainingMs = 300000, timerStartedAt = null;

  function timerCurrentRemainingMs() {
    const raw = timerRemainingMs - (timerRunning && timerStartedAt ? Date.now() - timerStartedAt : 0);
    return Math.max(0, raw);
  }
  function updateTimerDisplay() {
    const remainMs = timerCurrentRemainingMs();
    const finished = timerRunning && remainMs <= 0;
    timerValueEl.textContent = '-' + formatStopwatch(remainMs);
    timerCol.classList.toggle('running', timerRunning && !finished);
    timerCol.classList.toggle('finished', finished);
    timerLabel.textContent = finished ? '타이머 종료' : (timerRunning ? '타이머 진행중' : '타이머');
  }
  updateStopwatchDisplay();

  // 시계·카운트다운·스톱워치·타이머를 하나의 틱으로 묶어서 매초 같은 시점에 함께 갱신
  // (독립된 setInterval 여러 개는 서로 미세하게 위상이 어긋나 위 시계와 비교했을 때
  //  빨라지거나 느려지는 것처럼 보이는 원인이 됨)
  //
  // setInterval(fn, 1000)은 페이지가 로드된 순간을 기준으로 1초 간격을 도는 거라,
  // 실제 정각 경계(예: xx시 xx분 xx.000초)랑 위상이 안 맞을 수 있다 — 로드 시점이
  // .7초였다면 계속 .7초 지점마다 갱신되는 식이라 실제 초가 바뀐 뒤 최대 1초 가까이
  // 늦게 화면 숫자가 바뀌어 보일 수 있음(체감상 "시계가 안 맞는다"의 흔한 원인).
  // 매번 "다음 정각 초"까지 남은 ms를 다시 계산해서 setTimeout으로 거는 방식으로
  // 바꾸면, 오차가 누적되지 않고 항상 실제 초 경계에 맞춰 갱신된다.
  function scheduleTick() {
    const delay = 1000 - (getNow().getTime() % 1000);
    setTimeout(() => {
      updateClock();
      updateCountdown();
      updateStopwatchDisplay();
      updateTimerDisplay();
      scheduleTick();
    }, delay);
  }
  scheduleTick();

  /* ── 세로 모드 ─────────────────────────────────────────────── */
  function applyPortrait(on, left) {
    document.body.classList.remove('portrait-right', 'portrait-left');
    if (on) document.body.classList.add(left ? 'portrait-left' : 'portrait-right');
    if (on) applyPortraitSizes(); else applyLandscapeSizes();
  }

  /* ── 메인 탈리 (아날로그 램프) — 모든 모드에서 DM7 마이크 상태로만 구동 ─── */
  function updateMainTally() {
    box.classList.toggle('on-air', micLiveRaw);
  }

  /* ── 마이크(DM7 페이더) — SSE ─────────────────────────────────── */
  let micLiveRaw = false;
  function applyMicState(state) {
    micLiveRaw = state === 'ON_AIR';
    updateMainTally();
  }
  function connect() {
    const es = new EventSource('/stream');
    es.onmessage = e => applyMicState(e.data.trim());
    es.onerror = () => {
      es.close();
      setTimeout(connect, 3000);
    };
  }
  connect();

  /* ── 서버 설정 폴링 (컨트롤 페이지에서 바꾼 설정 반영) ───────── */
  let lastCalKey = '';
  function applySettings(s) {
    if (s.timeOffset !== undefined) timeOffsetSec = parseFloat(s.timeOffset);
    // settings.json에 아직 값이 없는 파이(과거 배포본)에서도 12시간제가
    // 기본으로 나오도록 undefined일 때 true로 둔다.
    clock12Hour = s.clock12Hour === undefined ? true : !!s.clock12Hour;
    infoRow.style.display = s.showDateWeather === false ? 'none' : 'flex';

    if (s.clockScale !== undefined) clockScale = parseFloat(s.clockScale);
    if (s.tallyScale !== undefined) tallyScale = parseFloat(s.tallyScale);
    if (s.tallyBoxScale !== undefined) { tallyBoxScale = parseFloat(s.tallyBoxScale); box.style.setProperty('--tally-box-scale', tallyBoxScale.toFixed(3)); }
    if (s.clockBoxScale !== undefined) { clockBoxScale = parseFloat(s.clockBoxScale); clockEl.style.setProperty('--clock-box-scale', clockBoxScale.toFixed(3)); }
    if (s.schScale   !== undefined) schScale   = parseFloat(s.schScale);
    if (s.schBoxScale !== undefined) { schBoxScale = parseFloat(s.schBoxScale); scheduleEl.style.setProperty('--sch-box-scale', schBoxScale.toFixed(3)); }
    if (s.pBoxScale   !== undefined) pBoxScale   = parseFloat(s.pBoxScale);
    if (s.pClockScale !== undefined) pClockScale = parseFloat(s.pClockScale);
    if (s.pTallyScale !== undefined) pTallyScale = parseFloat(s.pTallyScale);
    if (s.pSchScale   !== undefined) pSchScale   = parseFloat(s.pSchScale);
    if (s.pCdScale    !== undefined) pCdScale    = parseFloat(s.pCdScale);
    if (s.pSwScale    !== undefined) pSwScale    = parseFloat(s.pSwScale);

    const portraitOn   = !!s.portrait;
    const portraitLeft = !!s.portraitLeft;
    const wasPortrait = isPortraitMode();
    applyPortrait(portraitOn, portraitLeft);
    if (wasPortrait === portraitOn) {
      // 방향 안 바뀌었어도 크기값은 갱신
      if (portraitOn) applyPortraitSizes(); else applyLandscapeSizes();
    }

    countdownModeOn  = !!s.countdownMode;
    stopwatchModeOn  = !!s.stopwatchMode;
    scheduleVisible  = s.scheduleVisible === undefined ? true : !!s.scheduleVisible;
    applyBottomDisplay();

    if (s.broadcastTime !== undefined) broadcastTime = s.broadcastTime;
    if (s.broadcastEndTime !== undefined) broadcastEndTime = s.broadcastEndTime;
    broadcastTimeNextDay = !!s.broadcastTimeNextDay;
    broadcastEndTimeNextDay = !!s.broadcastEndTimeNextDay;
    broadcastProgramName = s.broadcastProgramName || '';
    broadcastVideoSource = s.broadcastVideoSource || '';
    broadcastScheduledEndTime = s.broadcastScheduledEndTime || '';
    broadcastScheduledEndTimeNextDay = !!s.broadcastScheduledEndTimeNextDay;
    broadcastIsLive = !!s.broadcastIsLive;
    broadcastStartConfirmed = s.broadcastStartConfirmed === undefined ? true : !!s.broadcastStartConfirmed;
    if (s.cdBoxScale !== undefined) cdBoxScale = parseFloat(s.cdBoxScale);
    if (s.cdTextScale !== undefined) cdTextScale = parseFloat(s.cdTextScale);
    if (s.cdLabelScale !== undefined) cdLabelScale = parseFloat(s.cdLabelScale);
    applyCdSize();
    // 시작/종료 시각·모드가 실제로 바뀌었을 때만 즉시 갱신 — 매 3초 폴링마다 무조건 다시 그리면
    // 매초 진행 중인 러너/채움바 트랜지션과 위상이 어긋나며 움직임이 불규칙해 보이는 원인이 된다.
    const cdSignature = countdownModeOn + ':' + broadcastTime + ':' + broadcastEndTime + ':' + broadcastTimeNextDay + ':' + broadcastEndTimeNextDay + ':' + broadcastProgramName + ':' + broadcastVideoSource + ':' + broadcastScheduledEndTime + ':' + broadcastIsLive + ':' + broadcastStartConfirmed;
    if (countdownModeOn && cdSignature !== lastCdSignature) updateCountdown(true);
    lastCdSignature = cdSignature;

    if (s.swBoxScale !== undefined) swBoxScale = parseFloat(s.swBoxScale);
    if (s.swTextScale !== undefined) swTextScale = parseFloat(s.swTextScale);
    applySwSize();

    if (s['cal-ts5']  !== undefined) calTs5On  = !!s['cal-ts5'];
    if (s['cal-ts5b'] !== undefined) calTs5bOn = !!s['cal-ts5b'];
    if (s.customCalendarUrl !== undefined) customCalUrl = s.customCalendarUrl;
    if (s.customCalendarEnabled !== undefined) customCalOn = !!s.customCalendarEnabled;
    const calKey = calTs5On + ':' + calTs5bOn + ':' + customCalOn + ':' + customCalUrl;
    if (calKey !== lastCalKey) { lastCalKey = calKey; loadSchedule(); }

    swRunning   = !!s.stopwatchRunning;
    swElapsedMs = s.stopwatchElapsedMs !== undefined ? parseFloat(s.stopwatchElapsedMs) : 0;
    swStartedAt = s.stopwatchStartedAt ? parseFloat(s.stopwatchStartedAt) : null;
    updateStopwatchDisplay();

    timerDurationSec = s.timerDurationSec !== undefined ? parseFloat(s.timerDurationSec) : 300;
    timerRunning     = !!s.timerRunning;
    timerRemainingMs = s.timerRemainingMs !== undefined ? parseFloat(s.timerRemainingMs) : timerDurationSec * 1000;
    timerStartedAt   = s.timerStartedAt ? parseFloat(s.timerStartedAt) : null;
    updateTimerDisplay();
  }

  function pollSettings() {
    fetch('/settings')
      .then(r => r.json())
      .then(applySettings)
      .catch(() => {});
  }
  pollSettings();
  setInterval(pollSettings, 3000);
  updateMainTally();

  const fsToggleBtn = document.getElementById('fs-toggle');
  fsToggleBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    fsToggleBtn.textContent = document.fullscreenElement ? '⤢' : '⛶';
  });
</script>
</body>
</html>
