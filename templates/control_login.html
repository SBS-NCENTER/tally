<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBS Web Scheduler Controller</title>

  <script>
    /* 탭 아이콘은 테마(보라/민트)를 따라간다 — <html data-theme>가 바뀔 때마다 교체 */
    (function () {
      var ICONS = { purple: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%224.5%22%20y%3D%229.5%22%20width%3D%2255%22%20height%3D%2250%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%231C1B22%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M14%208h36a11%2011%200%200%201%2011%2011v5H3v-5A11%2011%200%200%201%2014%208z%22%20fill%3D%22%238B6FD6%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%222%22%20width%3D%228%22%20height%3D%2214%22%20rx%3D%224%22%20fill%3D%22%231C1B22%22%2F%3E%3Crect%20x%3D%2241%22%20y%3D%222%22%20width%3D%228%22%20height%3D%2214%22%20rx%3D%224%22%20fill%3D%22%231C1B22%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2242%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%231C1B22%22%20stroke-width%3D%225.5%22%2F%3E%3Cpath%20d%3D%22M32%2035v7.5l5%203.5%22%20fill%3D%22none%22%20stroke%3D%22%238B6FD6%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E", mint: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%224.5%22%20y%3D%229.5%22%20width%3D%2255%22%20height%3D%2250%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%231C1B22%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M14%208h36a11%2011%200%200%201%2011%2011v5H3v-5A11%2011%200%200%201%2014%208z%22%20fill%3D%22%2322B39B%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%222%22%20width%3D%228%22%20height%3D%2214%22%20rx%3D%224%22%20fill%3D%22%231C1B22%22%2F%3E%3Crect%20x%3D%2241%22%20y%3D%222%22%20width%3D%228%22%20height%3D%2214%22%20rx%3D%224%22%20fill%3D%22%231C1B22%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2242%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%231C1B22%22%20stroke-width%3D%225.5%22%2F%3E%3Cpath%20d%3D%22M32%2035v7.5l5%203.5%22%20fill%3D%22none%22%20stroke%3D%22%2322B39B%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%       function sync() {
        var el = document.getElementById('favicon');
        var href = ICONS[document.documentElement.getAttribute('data-theme')] || ICONS.purple;
        if (el && el.getAttribute('href') !== href) el.setAttribute('href', href);
      }
      new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      document.addEventListener('DOMContentLoaded', sync);
    })();
  </script>
  <style>
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('/static/fonts/Pretendard-ExtraBold.woff2') format('woff2');
      font-weight: 800;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0a0a0a;
      font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #card {
      width: 100%;
      max-width: 360px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #3a7bd5;
      border-radius: 14px;
      padding: 28px 24px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 22px;
    }

    input[type=password] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #fff;
      border-radius: 8px;
      padding: 14px 14px;
      font-family: inherit;
      font-size: 1.3rem;
      letter-spacing: 0.3em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    input[type=password]:focus { outline: none; border-color: #3a7bd5; }

    button {
      width: 100%;
      margin-top: 14px;
      background: #1a4a8a;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
    }
    button:active { background: #163f77; }

    .error {
      margin-top: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ff6a6a;
      text-align: center;
    }
    .icon-lock {
      width: 1em;
      height: 1em;
      vertical-align: -0.15em;
      margin-right: 0.4em;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="card">
    <h1><svg class="icon-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>SBS Web Scheduler Controller</h1>
    <div class="sub">PIN을 입력하세요</div>
    <form method="POST">
      <input type="password" name="pin" inputmode="numeric" autocomplete="off" maxlength="12" autofocus />
      <button type="submit">확인</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>
</html>
